# GUACA — app stack (api + postgres + minio) for ONE tier.
# §4.3: the same file runs twice on the VM as separate compose projects:
#   ./infra/deploy.sh prod      → project guaca-prod,    infra/env/prod.env
#   ./infra/deploy.sh staging   → project guaca-staging, infra/env/staging.env
# TLS/routing lives in docker-compose.edge.yml (shared Caddy on guaca-edge).
# Variables with :? are required — compose refuses to start if they are
# empty, so a half-filled env file fails loudly instead of booting with
# blank secrets.
services:
  postgres:
    # PostGIS + h3 (see infra/postgres.Dockerfile) — the stock postgis image
    # has no h3 and the first migration fails on it.
    build:
      context: .
      dockerfile: infra/postgres.Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guaca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in infra/env/<tier>.env}
      POSTGRES_DB: guaca
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guaca} -d guaca"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set in infra/env/<tier>.env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set in infra/env/<tier>.env}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-guaca}:${POSTGRES_PASSWORD}@postgres:5432/guaca
      API_PORT: 3001
      NODE_ENV: production
      WEB_ORIGIN: ${WEB_ORIGIN:?set in infra/env/<tier>.env}
      INFERENCE_BASE_URL: ${INFERENCE_BASE_URL:?set in infra/env/<tier>.env}
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:?set in infra/env/<tier>.env}
      INFERENCE_MODEL: ${INFERENCE_MODEL:?set in infra/env/<tier>.env}
      INFERENCE_VISION_MODEL: ${INFERENCE_VISION_MODEL:?set in infra/env/<tier>.env}
      INFERENCE_TIMEOUT_MS: 30000
      INFERENCE_MAX_RETRIES: 2
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Store-review sign-in: app reviewers cannot receive email codes.
      # Inert unless set (see docs/PLAY_RELEASE.md).
      REVIEW_EMAIL: ${REVIEW_EMAIL:-}
      REVIEW_CODE: ${REVIEW_CODE:-}
      REVIEW_SPOTTER_PHONE: ${REVIEW_SPOTTER_PHONE:-}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-guaca-photos}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      SESSION_SECRET: ${SESSION_SECRET:?set in infra/env/<tier>.env}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:?set in infra/env/<tier>.env}
      # Knobs actually read by apps/api/src/index.ts — keep this list honest.
      GAP_AGENT_ENABLED: ${GAP_AGENT_ENABLED:-true}
      GAP_AGENT_DRY_RUN: ${GAP_AGENT_DRY_RUN:-false}
      GAP_AGENT_INTERVAL_MS: ${GAP_AGENT_INTERVAL_MS:-300000}
      # score is 0–100 (see index.ts default 45)
      GAP_AGENT_MIN_SCORE: ${GAP_AGENT_MIN_SCORE:-45}
      GAP_AGENT_MAX_MISSIONS_PER_DAY: ${GAP_AGENT_MAX_MISSIONS_PER_DAY:-5}
      GAP_AGENT_MAX_REWARD_MINOR: ${GAP_AGENT_MAX_REWARD_MINOR:-500}
      MISSION_EXPIRY_HOURS: ${MISSION_EXPIRY_HOURS:-48}
      PLANNER_MIN_CANDIDATES: ${PLANNER_MIN_CANDIDATES:-3}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_HOST_PORT:?set in infra/env/<tier>.env}:3001"
    networks:
      default: {}
      edge:
        # Caddy proxies to this name (guaca-prod-api / guaca-staging-api).
        # Required: a defaulted alias would let a misconfigured staging
        # answer as prod on the shared network.
        aliases:
          - ${EDGE_ALIAS:?set in infra/env/<tier>.env}

networks:
  default: {}
  edge:
    external: true
    name: guaca-edge

volumes:
  pgdata:
  miniodata:
