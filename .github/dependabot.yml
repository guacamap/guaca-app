# Dependabot — keeps the supply chain honest while the team is small.
# pnpm workspaces: one entry per package root; weekly cadence avoids
# Friday surprise PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One "chore(deps)" PR per area instead of a PR per transitive bump.
      root-dependencies:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /infra
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
