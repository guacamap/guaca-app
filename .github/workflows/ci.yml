name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: Typecheck and unit tests (zero network, zero infra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:unit

  integration:
    name: Integration tests (PostGIS + h3)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://guaca:guaca@localhost:5432/guaca
    steps:
      - uses: actions/checkout@v4

      # A `services:` block cannot be used here: the schema needs the h3
      # extension and postgis/postgis does not ship it, so migrations fail on
      # the first file. Build the same image production uses instead.
      - name: Start Postgres with PostGIS + h3
        run: |
          docker build -f infra/postgres.Dockerfile -t guaca-postgres:ci .
          docker run -d --name guaca-ci-db \
            -e POSTGRES_USER=guaca -e POSTGRES_PASSWORD=guaca -e POSTGRES_DB=guaca \
            -p 5432:5432 guaca-postgres:ci
          for i in $(seq 1 30); do
            docker exec guaca-ci-db pg_isready -U guaca -d guaca && break
            sleep 2
          done
          docker exec guaca-ci-db psql -U guaca -d guaca -c \
            "create extension if not exists h3" >/dev/null

      - uses: pnpm/action-setup@v6
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm migrate
      - run: pnpm test:integration

  # Advisory supply-chain check: KNOWN CVEs in the dependency tree. Fails
  # the job on high/critical so someone has to look — but a fix usually
  # arrives as a Dependabot PR within the week, not as an emergency.
  audit:
    name: Dependency audit (high+ critical only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
