<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="GUACA">
  <!--
    The guacamaya in flight, GUACA's mark.

    One wing, not two. A profile bird with a second foreshortened wing turns
    into a fan of spikes at any size below about 48px, and the silhouette is
    worth more than the anatomy. What identifies the bird is the scarlet
    macaw's own band order — red at the leading edge, gold behind it, blue at
    the trailing tip — so the wing carries that and no feather detail at all.

    The bands are laid over one solid wing from the trailing edge inward, each
    sharing the tip and trailing curve, so they abut exactly and no ground can
    show between them.

    Square, never rounded; this world has no rounded corners. Colour lives only
    inside the mark. The page keeps bone, ink, and a merlot reserved strictly
    for what the map does not know.
  -->
  <rect width="64" height="64" fill="#F7F6F2"/>

  <g stroke-linejoin="round">
    <!-- Tail: two long tapering streamers, bowed so they trail rather than
         point, and kept clear of the wing above them. -->
    <path d="M30 36 C22 38 12 42 3 48 C11 46 21 43 30 40 Z" fill="#C8321B"/>
    <path d="M30 40 C24 42.5 17 46.5 11 52 C18 49 25 46 30 43.5 Z" fill="#1E5A9C"/>

    <!-- Wing. -->
    <path d="M36 30 C30 21 23 11 16 4 C17 16 21 28 28 35 C32 37 35 34 36 30 Z" fill="#C8321B"/>
    <path d="M32 33 C26 24 20 13 16 4 C17 16 21 28 28 35 C30 36 31.5 34.8 32 33 Z" fill="#E0A526"/>
    <path d="M28.5 34.6 C23 26 18 14 16 4 C17 16 21 28 28 35 C28.2 35 28.4 34.8 28.5 34.6 Z" fill="#1E5A9C"/>

    <!-- Body and head: one teardrop, heaviest at the breast. -->
    <path d="M27 35 C27 30 31 26 38 26 C45 26 50 29 50 32.5 C50 36 45 39 38 39 C31 39 27 38 27 35 Z" fill="#C8321B"/>

    <!-- Bare white cheek, the macaw's most specific feature. -->
    <path d="M42 28 C46.5 28 49 30 49 32.5 C49 35 46.5 37 43.5 37 C40.5 37 39 35 39 32.5 C39 30 40 28 42 28 Z" fill="#F7F6F2"/>

    <!-- Eye. -->
    <circle cx="44.5" cy="31.6" r="1.9" fill="#0B0B0B"/>

    <!-- Beak: a deep hook. The pale upper mandible carries the silhouette and
         the dark lower one is kept small, or it reads as a blot rather than a
         bill. -->
    <path d="M49 27.2 C55.5 27.2 60.5 31 60.5 35.2 C60.5 37.5 58.8 38.4 57 37.4 C56 33.6 53.2 31.7 49 31.7 Z"
          fill="#EDEAE3" stroke="#0B0B0B" stroke-width="1.2"/>
    <path d="M49 33.4 C52.4 33.4 54.8 34.6 55.9 36.2 C54.2 37.4 51 37.4 49 36.1 Z" fill="#0B0B0B"/>
  </g>
</svg>
